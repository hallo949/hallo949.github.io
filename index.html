<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HS-GAMES</title>
<style>
body{margin:0;font-family:sans-serif;background:#0f0f0f;color:white;text-align:center;padding:20px}
h1{font-size:40px;color:#00ff88}
.card{background:#1e1e1e;padding:20px;border-radius:20px;max-width:400px;margin:20px auto;border:2px solid #00ff88}
button{display:block;width:100%;background:#00ff88;color:black;padding:15px;margin:10px 0;border:0;border-radius:10px;font-weight:bold;font-size:18px;cursor:pointer}
#gameArea{background:black;margin:20px auto;padding:10px;border-radius:15px;display:none;max-width:400px}
canvas{background:#111;display:block;margin:auto}
</style>
</head>
<body>
<h1>🎮 HS-GAMES</h1>
<div class="card">
<h2>Willkommen!</h2>
<button onclick="startGame(1)">🕹️ Snake spielen</button>
<button onclick="startGame(2)">🚀 Clicker Game</button>
<button onclick="showScore()">🏆 Highscores</button>
</div>

<div id="gameArea">
<h2 id="gameTitle"></h2>
<canvas id="game" width="300" height="300"></canvas>
<p id="scoreText"></p>
<button onclick="closeGame()" style="background:#ff4444;color:white">Zurück</button>
</div>

<p style="opacity:0.5">by hallo949</p>

<script>
let gameArea=document.getElementById('gameArea');
let canvas=document.getElementById('game');
let ctx=canvas.getContext('2d');
let score=0;
let gameInterval;

function startGame(n){
 gameArea.style.display='block';
 if(n==1){document.getElementById('gameTitle').innerText='Snake - Nutze Pfeile'; startSnake();}
 if(n==2){document.getElementById('gameTitle').innerText='Klick so schnell du kannst!'; startClicker();}
 window.scrollTo(0, document.body.scrollHeight);
}
function closeGame(){gameArea.style.display='none'; clearInterval(gameInterval);}
function showScore(){alert('🏆 Highscores\n\nSnake Highscore: '+localStorage.getItem('snakeHS')+'\nClicker Highscore: '+localStorage.getItem('clickHS'))}

// SNAKE SIMPLE
function startSnake(){
 let snake=[{x:10,y:10}], food={x:15,y:15}, dir={x:0,y:0}; score=0;
 document.onkeydown=e=>{if(e.key=='ArrowUp')dir={x:0,y:-1};if(e.key=='ArrowDown')dir={x:0,y:1};if(e.key=='ArrowLeft')dir={x:-1,y:0};if(e.key=='ArrowRight')dir={x:1,y:0};}
 clearInterval(gameInterval);
 gameInterval=setInterval(()=>{
  let head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if(head.x<0||head.x>19||head.y<0||head.y>19){closeGame();return;}
  snake.unshift(head);
  if(head.x==food.x&&head.y==food.y){score++; food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};}else{snake.pop();}
  ctx.fillStyle='#111'; ctx.fillRect(0,0,300,300);
  ctx.fillStyle='#00ff88'; snake.forEach(s=>ctx.fillRect(s.x*15,s.y*15,14,14));
  ctx.fillStyle='red'; ctx.fillRect(food.x*15,food.y*15,14,14);
  document.getElementById('scoreText').innerText='Score: '+score;
  if(score>localStorage.getItem('snakeHS'))localStorage.setItem('snakeHS',score);
 },100);
}
// CLICKER
function startClicker(){
 score=0; let time=10;
 document.getElementById('scoreText').innerText='Klicke auf das Feld!';
 canvas.onclick=()=>{score++; document.getElementById('scoreText').innerText='Score: '+score+' | Zeit: '+time;};
 clearInterval(gameInterval);
 gameInterval=setInterval(()=>{
  time--; document.getElementById('scoreText').innerText='Score: '+score+' | Zeit: '+time;
  if(time<=0){clearInterval(gameInterval); alert('Zeit vorbei! Score: '+score); if(score>localStorage.getItem('clickHS'))localStorage.setItem('clickHS',score); closeGame();}
 },1000);
 ctx.fillStyle='#00ff88'; ctx.fillRect(0,0,300,300); ctx.fillStyle='black'; ctx.font='20px sans-serif'; ctx.fillText('KLICKE HIER!',80,150);
}
</script>
</body>
</html>
