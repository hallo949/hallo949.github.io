<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HS-GAMES V3 - 10 GAMES</title>
<style>
body{margin:0;font-family:sans-serif;background:#070707;color:white;text-align:center;padding:12px}
h1{font-size:42px;color:#00ff88;text-shadow:0 0 15px #00ff88;margin:10px 0}
.sub{opacity:0.5;margin-bottom:15px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:0 auto}
.btn{background:#151515;border:2px solid #222;padding:14px 6px;border-radius:14px;color:white;font-weight:bold;font-size:13px;cursor:pointer}
.btn:active{transform:scale(0.95);border-color:#00ff88}
.btn span{font-size:26px;display:block}
#gameArea{background:#111;border:2px solid #00ff88;margin:18px auto;padding:12px;border-radius:18px;display:none;max-width:440px}
canvas{background:#000;display:block;margin:8px auto;border-radius:10px;touch-action:none}
#controls button{margin:3px;padding:8px 12px;background:#222;color:white;border:1px solid #333;border-radius:7px}
#closeBtn{background:#ff2a2a;color:white;border:0;padding:10px 18px;border-radius:9px;font-weight:bold;margin-top:8px}
</style>
</head>
<body>
<h1>HS-GAMES</h1>
<p class="sub">V3 by hallo949 • 10 Games • 100% Handy</p>

<div class="grid">
<button class="btn" onclick="start(1)"><span>🐍</span>Snake</button>
<button class="btn" onclick="start(2)"><span>🧱</span>Breakout</button>
<button class="btn" onclick="start(3)"><span>🐦</span>Flappy</button>
<button class="btn" onclick="start(4)"><span>⚡</span>Clicker</button>
<button class="btn" onclick="start(5)"><span>🎯</span>Aim</button>
<button class="btn" onclick="start(6)"><span>🧠</span>Memory</button>
<button class="btn" onclick="start(7)"><span>🏓</span>Pong</button>
<button class="btn" onclick="start(8)"><span>💣</span>Minesweeper</button>
<button class="btn" onclick="start(9)"><span>🦖</span>Dino Run</button>
<button class="btn" onclick="start(10)"><span>🔢</span>2048 Mini</button>
</div>

<div id="gameArea">
<h2 id="gTitle" style="margin:4px;font-size:18px"></h2>
<canvas id="game" width="320" height="320"></canvas>
<div id="controls"></div>
<p id="scoreText" style="color:#00ff88;font-weight:bold"></p>
<button id="closeBtn" onclick="closeGame()">✖ Schließen</button>
</div>

<script>
let canvas=document.getElementById('game'), ctx=canvas.getContext('2d'), loop, score, area=document.getElementById('gameArea');
function start(n){area.style.display='block'; area.scrollIntoView({behavior:'smooth'}); document.getElementById('controls').innerHTML=''; score=0; clearInterval(loop); canvas.onclick=null; document.onkeydown=null; canvas.onmousemove=null; if(n==1) snake(); if(n==2) breakout(); if(n==3) flappy(); if(n==4) clicker(); if(n==5) aim(); if(n==6) memory(); if(n==7) pong(); if(n==8) mines(); if(n==9) dino(); if(n==10) mini2048();}
function closeGame(){area.style.display='none'; clearInterval(loop);}

// 1 SNAKE
function snake(){document.getElementById('gTitle').innerText='🐍 SNAKE'; let sn=[{x:10,y:10}], food={x:15,y:15}, dir={x:1,y:0}; score=0; document.onkeydown=e=>{if(e.key=='ArrowUp'&&dir.y==0)dir={x:0,y:-1};if(e.key=='ArrowDown'&&dir.y==0)dir={x:0,y:1};if(e.key=='ArrowLeft'&&dir.x==0)dir={x:-1,y:0};if(e.key=='ArrowRight'&&dir.x==0)dir={x:1,y:0};}; document.getElementById('controls').innerHTML='<button onclick="dir={x:0,y:-1}">⬆️</button><br><button onclick="dir={x:-1,y:0}">⬅️</button><button onclick="dir={x:1,y:0}">➡️</button><br><button onclick="dir={x:0,y:1}">⬇️</button>'; loop=setInterval(()=>{let h={x:sn[0].x+dir.x,y:sn[0].y+dir.y}; if(h.x<0||h.x>19||h.y<0||h.y>19||sn.some(s=>s.x==h.x&&s.y==h.y)){clearInterval(loop);alert('Game Over Score:'+score);closeGame();return;} sn.unshift(h); if(h.x==food.x&&h.y==food.y){score++;food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)}} else sn.pop(); ctx.fillStyle='#000';ctx.fillRect(0,0,320,320);ctx.fillStyle='#00ff88';sn.forEach(s=>ctx.fillRect(s.x*16,s.y*16,15,15));ctx.fillStyle='red';ctx.fillRect(food.x*16,food.y*16,15,15);document.getElementById('scoreText').innerText='Score: '+score;},110);}

// 2 BREAKOUT
function breakout(){document.getElementById('gTitle').innerText='🧱 BREAKOUT';
