<title>HS-GAMES - RED EDITION</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050505;color:white;font-family:'Segoe UI',sans-serif;text-align:center;overflow-x:hidden}
.header{background:radial-gradient(ellipse at center,#1a0000 0%,#050505 70%), linear-gradient(135deg,#0a0a0a,#000);border-bottom:3px solid #ff0000;padding:25px 15px 20px;box-shadow:0 0 30px rgba(255,0,0,0.5);position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:0;left:-50%;width:200%;height:2px;background:linear-gradient(90deg,transparent,#ff0000,transparent);animation:scan 3s linear infinite}
@keyframes scan{0%{top:0}100%{top:100%}}
.logo{font-size:52px;font-weight:900;color:#ff0000;text-shadow:0 0 10px #ff0000,0 0 20px #ff0000,0 0 40px #ff0000;letter-spacing:2px}
.subtitle{color:#ff6666;font-size:13px;letter-spacing:6px;margin-top:8px;font-weight:bold}
.elite{margin:15px auto 0;border:1px solid #ff0000;padding:6px 15px;display:inline-block;font-size:11px;letter-spacing:3px;color:#ff0000;background:rgba(255,0,0,0.1)}
.sub{opacity:0.5;font-size:12px;margin:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:15px auto;padding:0 10px}
.btn{background:linear-gradient(145deg,#151515,#0a0a0a);border:2px solid #222;padding:16px 5px;border-radius:14px;color:white;font-weight:bold;font-size:13px;cursor:pointer;transition:0.2s}
.btn:active,.btn:hover{border-color:#ff0000;background:#1a0000;box-shadow:0 0 15px rgba(255,0,0,0.6);transform:scale(0.97);color:#ff0000}
.btn span{font-size:28px;display:block;margin-bottom:3px}
#gameBox{display:none;background:#0f0f0f;border:2px solid #ff0000;border-radius:20px;padding:12px;margin:15px auto;max-width:400px;box-shadow:0 0 20px rgba(255,0,0,0.3)}
canvas{background:black;display:block;margin:8px auto;border-radius:10px;width:320px;height:320px;touch-action:none;border:1px solid #333}
.ctrl button{margin:3px;padding:12px 16px;background:#1a1a1a;color:white;border-radius:8px;border:1px solid #333;font-size:18px}
#close{background:#ff0000;color:white;border:0;padding:12px 20px;border-radius:10px;font-weight:bold;width:100%;margin-top:10px}
#info{color:#ff0000;font-weight:bold;margin-top:5px}
</style>
</head>
